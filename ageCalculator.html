<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Boldonse&family=DM+Serif+Display:ital@0;1&family=Lobster+Two:ital,wght@1,700&family=Noto+Kufi+Arabic:wght@100..900&family=Noto+Nastaliq+Urdu:wght@400..700&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>AGE CALCULATOR</h1>
      <!-- inputs -->
      <div class="NameSect">
        <label for="Name">Name</label>
        <input id="Name" type="text" required />
      </div>
      <div class="dateSect">
        <label for="BirthYear">Birth Year</label>
        <input id="BirthYear" type="number" required />
      </div>
      <!-- calculation-button -->
      <button onclick="calculateAge()">Calculate Your Age</button>
      <h1>Result</h1>
      <!-- result will be displayed here -->
      <div id="display"></div>
    </div>

    <!-- Javascript Code -->
    <script src="script.js"></script>
  </body>
</html>
